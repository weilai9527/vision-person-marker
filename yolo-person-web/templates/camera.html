<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄像头实时监测</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <main class="app-shell">
        <header class="app-header">
            <div class="brand">
                <p class="eyebrow">Local Camera Monitor</p>
                <h1>摄像头实时监测</h1>
            </div>
            <nav class="header-actions">
                <a href="{{ url_for('index') }}" class="button-secondary">图片检测</a>
                <a href="{{ url_for('video_page') }}" class="button-secondary">视频检测</a>
                <a href="{{ url_for('vehicle_page') }}" class="button-secondary">车辆视频</a>
                <a href="/vehicle-image" class="button-secondary">车辆图片</a>
                <a href="{{ url_for('history') }}" class="button-secondary">历史记录</a>
            </nav>
        </header>

        <section class="camera-workspace">
            <div class="surface camera-panel">
                <div class="camera-view-grid">
                    <section class="camera-feed">
                        <div class="camera-feed-header">
                            <div>
                                <span class="camera-feed-title">原始画面</span>
                                <span class="camera-feed-subtitle">Camera Input</span>
                            </div>
                            <span class="camera-feed-chip" id="cameraFeedChip">无标注</span>
                        </div>
                        <div class="camera-view">
                            <video id="cameraVideo" autoplay playsinline muted></video>
                            <div class="camera-placeholder" id="cameraPlaceholder">
                                <span class="camera-placeholder-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none">
                                        <path d="M15 10l4.55-2.27A1 1 0 0121 8.62v6.76a1 1 0 01-1.45.9L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                                <strong>点击开始后显示摄像头画面</strong>
                            </div>
                        </div>
                    </section>

                    <section class="camera-feed camera-feed-detection">
                        <div class="camera-feed-header">
                            <div>
                                <span class="camera-feed-title">检测画面</span>
                                <span class="camera-feed-subtitle">YOLO Overlay</span>
                            </div>
                            <span class="camera-feed-chip is-live">实时</span>
                        </div>
                        <div class="camera-view">
                            <video id="cameraDetectVideo" autoplay playsinline muted></video>
                            <canvas id="cameraOverlay" class="camera-overlay" aria-hidden="true"></canvas>
                            <div class="camera-placeholder" id="cameraDetectPlaceholder">
                                <span class="camera-placeholder-icon" aria-hidden="true">
                                    <svg viewBox="0 0 24 24" fill="none">
                                        <path d="M15 10l4.55-2.27A1 1 0 0121 8.62v6.76a1 1 0 01-1.45.9L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </span>
                                <strong>实时检测结果会显示在这里</strong>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="camera-controls">
                    <label class="field camera-device-field" for="cameraSelect">
                        <span>摄像头</span>
                        <select id="cameraSelect" disabled>
                            <option value="">正在检测设备...</option>
                        </select>
                    </label>

                    <div class="camera-buttons">
                        <button type="button" id="startCameraButton">开始</button>
                        <button type="button" class="button-secondary" id="monitorCameraButton" disabled>实时检测</button>
                        <button type="button" class="button-secondary" id="targetToggleButton" disabled>切换车辆</button>
                        <button type="button" class="button-secondary" id="recordCameraButton" disabled>开始录像</button>
                        <button type="button" class="button-danger" id="stopCameraButton" disabled>停止</button>
                    </div>
                </div>
            </div>

            <aside class="surface camera-status-panel">
                <div class="camera-status-heading">
                    <h2 class="surface-title">设备状态</h2>
                    <p id="cameraHint">浏览器会在开始时请求摄像头权限。</p>
                </div>
                <div class="camera-status-line">
                    <span class="camera-status-dot is-idle" id="cameraStatusDot"></span>
                    <strong id="cameraStatusText">就绪</strong>
                </div>
                <div class="camera-live-stats">
                    <div class="camera-live-count">
                        <span id="cameraCountLabel">当前人数</span>
                        <strong id="cameraPersonCount">0</strong>
                    </div>
                    <div class="camera-live-meta" id="cameraDetectMeta">未开始实时检测</div>
                </div>
                <div class="camera-record-panel" id="cameraRecordPanel" hidden>
                    <div class="camera-record-head">
                        <div>
                            <strong>录像回放</strong>
                            <span id="cameraRecordMeta">刚刚录制</span>
                        </div>
                        <a class="button-secondary" id="cameraRecordDownload" href="#" download="camera-recording.webm">下载录像</a>
                    </div>
                    <video id="cameraRecordPreview" controls></video>
                </div>
            </aside>
        </section>
    </main>

    <div class="toast" id="cameraToast" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='camera.js') }}"></script>
</body>
</html>
